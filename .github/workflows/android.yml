name: Build UniversalPOS Android APK

on:

workflow_dispatch:

push:
branches:
- main

permissions:
contents: read

jobs:

build:

```
name: Build APK

runs-on: ubuntu-22.04

steps:

  # ======================================================
  # CHECKOUT
  # ======================================================

  - name: Checkout repository
    uses: actions/checkout@v4


  # ======================================================
  # PYTHON
  # ======================================================

  - name: Setup Python
    uses: actions/setup-python@v5

    with:
      python-version: "3.10"
      cache: "pip"


  # ======================================================
  # JAVA
  # ======================================================

  - name: Setup Java
    uses: actions/setup-java@v4

    with:
      distribution: temurin
      java-version: "17"


  # ======================================================
  # LINUX DEPENDENCIES
  # ======================================================

  - name: Install system dependencies
    run: |

      sudo apt-get update

      sudo apt-get install -y \
        git \
        zip \
        unzip \
        build-essential \
        autoconf \
        automake \
        libtool \
        pkg-config \
        cmake \
        gettext \
        zlib1g-dev \
        libncurses5-dev \
        libncursesw5-dev \
        libffi-dev \
        libssl-dev


  # ======================================================
  # PYTHON BUILD TOOLS
  # ======================================================

  - name: Install Python build tools
    run: |

      python -m pip install --upgrade pip setuptools wheel

      python -m pip install \
        buildozer==1.5.0 \
        cython==0.29.37


  # ======================================================
  # VERIFY CONFIGURATION
  # ======================================================

  - name: Verify Buildozer configuration
    run: |

      echo "======================================"
      echo "PYTHON"
      echo "======================================"

      python --version

      echo "======================================"
      echo "JAVA"
      echo "======================================"

      java -version

      echo "======================================"
      echo "BUILDOZER"
      echo "======================================"

      buildozer --version

      echo "======================================"
      echo "SPEC"
      echo "======================================"

      grep -E \
        "^(title|package.name|version|requirements|android.api|android.minapi|android.ndk|android.build_tools_version|android.archs)" \
        buildozer.spec


  # ======================================================
  # PREPARE ANDROID DIRECTORIES
  # ======================================================

  - name: Prepare Android environment
    run: |

      mkdir -p "$HOME/.android"

      touch "$HOME/.android/repositories.cfg"

      mkdir -p "$HOME/.buildozer"


  # ======================================================
  # CLEAN OLD BUILDOZER DATA
  # ======================================================

  - name: Clean previous Buildozer state
    run: |

      rm -rf .buildozer

      rm -rf bin

      mkdir -p bin


  # ======================================================
  # BUILD
  # ======================================================

  - name: Build debug APK
    env:

      PIP_DISABLE_PIP_VERSION_CHECK: "1"

      PYTHONUNBUFFERED: "1"

    run: |

      export PATH="$HOME/.local/bin:$PATH"

      echo "======================================"
      echo "START BUILDOZER"
      echo "======================================"

      buildozer -v android debug


  # ======================================================
  # CHECK APK
  # ======================================================

  - name: Check APK output
    run: |

      echo "======================================"
      echo "APK OUTPUT"
      echo "======================================"

      ls -lah bin/

      test -n "$(find bin -maxdepth 1 -type f -name '*.apk' -print -quit)"


  # ======================================================
  # UPLOAD APK
  # ======================================================

  - name: Upload APK
    uses: actions/upload-artifact@v4

    with:

      name: UniversalPOS-debug-APK

      path: bin/*.apk

      if-no-files-found: error

      retention-days: 14


  # ======================================================
  # UPLOAD BUILD LOG IF FAILED
  # ======================================================

  - name: Upload Buildozer logs
    if: failure()

    uses: actions/upload-artifact@v4

    with:

      name: UniversalPOS-build-logs

      path: |

        .buildozer/**/*.log
        .buildozer/**/*.txt
        buildozer.spec

      if-no-files-found: ignore

      retention-days: 7
```
